name: Cabeda Area 01 NDVI Homologation

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/ux-2.0-intelligent-flow"
    paths:
      - ".github/workflows/cabeda-area01-ndvi-homologation.yml"
      - "scripts/homologate-cabeda-area01-ndvi.mjs"

permissions:
  contents: read

concurrency:
  group: cabeda-area01-ndvi-homologation
  cancel-in-progress: false

jobs:
  raster:
    name: archive-area01-real-ndvi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologation
    env:
      APP_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_SSL: require
      NDVI_SATELLITE_PROVIDER: earth-search
      NDVI_RASTER_STORAGE_PROVIDER: inline

    steps:
      - name: Checkout do candidato PR #88
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validar secret sem expor valor
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APP_DATABASE_URL:-}" ]; then
            echo "::error::HOMOLOGATION_DATABASE_URL não foi entregue ao job."
            exit 1
          fi
          echo "Secret presente; o sentinela do Neon será validado pelo executor."

      - name: Instalar dependências
        run: npm ci

      - name: Gerar e arquivar raster NDVI real da Área 01
        id: raster
        shell: bash
        run: |
          set -uo pipefail
          RESULT_FILE="cabeda-area01-ndvi.json"
          echo "result_file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"
          set +e
          node --experimental-strip-types --experimental-transform-types --experimental-loader ./scripts/node-ts-alias-loader.mjs \
            scripts/homologate-cabeda-area01-ndvi.mjs | tee "${RESULT_FILE}"
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "${STATUS}"

      - name: Resumo sanitizado
        if: ${{ always() && steps.raster.outputs.result_file != '' }}
        shell: bash
        run: |
          RESULT_FILE="${{ steps.raster.outputs.result_file }}"
          if [ ! -s "${RESULT_FILE}" ]; then
            echo "## Cabeda Área 01 · NDVI" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Executor não produziu resultado sanitizado." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          RESULT_FILE="${RESULT_FILE}" node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
          console.log("## Cabeda Área 01 · raster NDVI real");
          console.log("");
          console.log(`- status: **${p.status}**`);
          console.log(`- aquisição: ${p.capturedAt}`);
          console.log(`- NDVI médio: ${p.meanNdvi}`);
          console.log(`- pixels válidos: ${p.pixelCount}`);
          console.log(`- raster: ${p.rasterWidth}×${p.rasterHeight}, ${p.rasterBytes} bytes`);
          console.log(`- storage: ${p.storage}`);
          console.log(`- SHA-256 prefix: ${p.sha256Prefix}`);
          console.log(`- integridade verificada: ${p.integrityVerified === true || p.status === "ALREADY_ARCHIVED"}`);
          NODE

      - name: Salvar evidência sanitizada
        if: ${{ always() && steps.raster.outputs.result_file != '' && hashFiles(steps.raster.outputs.result_file) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cabeda-area01-ndvi-homologation
          path: ${{ steps.raster.outputs.result_file }}
          if-no-files-found: ignore
          retention-days: 30
