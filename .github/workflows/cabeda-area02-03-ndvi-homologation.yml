name: Cabeda Area 02-03 NDVI Homologation

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/ux-2.0-intelligent-flow"
    paths:
      - ".github/workflows/cabeda-area02-03-ndvi-homologation.yml"
      - "scripts/homologate-cabeda-area02-03-ndvi.mjs"

permissions:
  contents: read

concurrency:
  group: cabeda-area02-03-ndvi-homologation
  cancel-in-progress: false

jobs:
  raster:
    name: archive-area02-03-real-ndvi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homologation
    env:
      APP_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_SSL: require
      NDVI_SATELLITE_PROVIDER: earth-search
      NDVI_RASTER_STORAGE_PROVIDER: inline

    steps:
      - name: Checkout do candidato PR #88
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validar secret sem expor valor
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_DATABASE_URL:-}" || { echo "::error::HOMOLOGATION_DATABASE_URL ausente."; exit 1; }

      - name: Instalar dependências
        run: npm ci

      - name: Gerar e arquivar rasters NDVI reais
        id: raster
        shell: bash
        run: |
          set -uo pipefail
          RESULT_FILE="cabeda-area02-03-ndvi.json"
          echo "result_file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"
          set +e
          node --experimental-strip-types --experimental-transform-types --experimental-loader ./scripts/node-ts-alias-loader.mjs \
            scripts/homologate-cabeda-area02-03-ndvi.mjs | tee "${RESULT_FILE}"
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "${STATUS}"

      - name: Resumo sanitizado
        if: ${{ always() && steps.raster.outputs.result_file != '' }}
        shell: bash
        run: |
          RESULT_FILE="${{ steps.raster.outputs.result_file }}"
          if [ ! -s "${RESULT_FILE}" ]; then
            echo "## Cabeda Áreas 02/03 · NDVI" >> "${GITHUB_STEP_SUMMARY}"
            echo "Executor não produziu resultado sanitizado." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          RESULT_FILE="${RESULT_FILE}" node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
          console.log("## Cabeda Áreas 02/03 · rasters NDVI reais");
          console.log("");
          for (const item of p.results || []) {
            console.log(`- **${item.analysisCode} / ${item.fieldName}**: ${item.status}`);
            console.log(`  - aquisição: ${item.capturedAt}`);
            console.log(`  - NDVI médio: ${item.meanNdvi}`);
            console.log(`  - pixels válidos: ${item.pixelCount}`);
            console.log(`  - raster: ${item.rasterWidth}×${item.rasterHeight}, ${item.rasterBytes} bytes`);
            console.log(`  - storage: ${item.storage}; integridade=${item.integrityVerified}`);
          }
          NODE

      - name: Salvar evidência sanitizada
        if: ${{ always() && steps.raster.outputs.result_file != '' && hashFiles(steps.raster.outputs.result_file) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cabeda-area02-03-ndvi-homologation
          path: ${{ steps.raster.outputs.result_file }}
          if-no-files-found: ignore
          retention-days: 30
