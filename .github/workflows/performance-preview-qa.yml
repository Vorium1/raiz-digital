name: Performance Fast Path Browser QA

on:
  push:
    branches:
      - "feature/performance-login-fast-path"
    paths:
      - ".github/workflows/performance-preview-qa.yml"
      - "e2e/performance-fast-path.spec.ts"
      - "src/components/login-form.tsx"
      - "src/lib/auth/session.ts"
      - "src/lib/db.ts"
      - "src/app/(platform)/inicio/**"
      - "src/app/(platform)/talhoes/**"
      - "src/app/(platform)/resultados/**"
      - "src/app/(platform)/atencao/**"
      - "src/lib/repositories/field-overview.ts"
      - "src/components/simple-field-overview.tsx"
      - "src/components/deferred-field-overview-tabs.tsx"
      - "src/lib/repositories/results-overview.ts"
      - "src/lib/repositories/alerts.ts"
      - "src/lib/repositories/alerts-read-model.ts"
      - "src/lib/repositories/ndvi.ts"
      - "src/app/api/fields/**"
  workflow_dispatch:

concurrency:
  group: performance-fast-path-preview-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  browser:
    name: issue-120-browser-qa
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    env:
      E2E_ADMIN_EMAIL: admin@raiz.local
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_SSL: require

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Obter token OIDC para Deployment Protection
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Descobrir Preview Vercel deste SHA
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 60; attempt++) {
              const deployments = await github.rest.repos.listDeployments({
                owner, repo, sha: context.sha, per_page: 20,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 20,
                });
                const ready = statuses.data.find((status) =>
                  status.state === "success"
                  && typeof status.environment_url === "string"
                  && status.environment_url.startsWith("https://")
                );
                if (ready) {
                  core.setOutput("url", ready.environment_url);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.setFailed("Nenhum environment_url de Preview ficou pronto para o SHA atual.");

      - name: Instalar dependências
        run: npm ci

      - name: Preparar sessão temporária quando senha E2E não estiver configurada
        if: ${{ env.E2E_ADMIN_PASSWORD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createHash, randomBytes } from "node:crypto";
          import pg from "pg";

          const databaseUrl = process.env.HOMOLOGATION_DATABASE_URL?.trim();
          if (!databaseUrl) throw new Error("HOMOLOGATION_DATABASE_URL ausente.");

          const pool = new pg.Pool({
            connectionString: databaseUrl,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          const client = await pool.connect();
          try {
            await client.query("BEGIN");
            const account = await client.query(
              `SELECT u.id::text AS user_id, tm.tenant_id::text AS tenant_id
               FROM users u
               JOIN tenant_members tm ON tm.user_id=u.id AND tm.active=true
               JOIN tenants t ON t.id=tm.tenant_id AND t.status='ACTIVE'
               WHERE u.email=$1::citext
               ORDER BY u.is_platform_curator DESC, tm.tenant_id
               LIMIT 1`,
              [process.env.E2E_ADMIN_EMAIL ?? "admin@raiz.local"],
            );
            const row = account.rows[0];
            if (!row?.user_id || !row?.tenant_id) throw new Error("Conta E2E ativa não encontrada.");

            const token = randomBytes(32).toString("base64url");
            const tokenHash = createHash("sha256").update(token).digest("hex");
            const session = await client.query(
              `INSERT INTO user_sessions (user_id, tenant_id, token_hash, expires_at, user_agent, ip_hash)
               VALUES ($1::uuid,$2::uuid,$3,now()+interval '45 minutes','github-actions-performance-qa',NULL)
               RETURNING id::text`,
              [row.user_id, row.tenant_id, tokenHash],
            );
            await client.query("COMMIT");

            console.log(`::add-mask::${token}`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_TOKEN=${token}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_ID=${session.rows[0].id}\n`);
          } catch (error) {
            await client.query("ROLLBACK").catch(() => {});
            throw error;
          } finally {
            client.release();
            await pool.end();
          }
          NODE

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar QA de performance no Preview
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npx playwright test e2e/performance-fast-path.spec.ts

      - name: Revogar sessão temporária
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_SESSION_ID:-}" ] || [ -z "${HOMOLOGATION_DATABASE_URL:-}" ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import pg from "pg";
          const pool = new pg.Pool({
            connectionString: process.env.HOMOLOGATION_DATABASE_URL,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          await pool.query(
            "UPDATE user_sessions SET revoked_at=now() WHERE id=$1::uuid AND user_agent='github-actions-performance-qa' AND revoked_at IS NULL",
            [process.env.E2E_SESSION_ID],
          );
          await pool.end();
          NODE

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-fast-path-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
