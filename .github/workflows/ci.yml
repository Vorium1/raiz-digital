name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'work/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Rodar testes (lógica pura, sem banco de dados)
        run: |
          npm run test:handoff
          node --experimental-strip-types scripts/test-map-runtime-recovery.mjs
          node --experimental-strip-types scripts/test-final-route-permissions.mjs
          node --experimental-strip-types scripts/test-analysis-evidence-freshness.mjs
          node --experimental-strip-types scripts/test-ux3-zero-training.mjs

      - name: Validar preflight automático de homologação
        run: node --experimental-strip-types scripts/test-homologation-readiness.mjs

      - name: Validar profundidade progressiva das análises
        run: node --experimental-strip-types scripts/test-analysis-depth-readiness.mjs

      - name: Build de produção
        run: npm run build
