services:
  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: raiz_digital
      POSTGRES_USER: raiz
      POSTGRES_PASSWORD: raiz
    ports:
      - "5432:5432"
    volumes:
      - raiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiz -d raiz_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raiz_postgres:
