name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'work/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Rodar testes (lógica pura, sem banco de dados)
        run: npm run test:handoff

      - name: Build de produção
        run: npm run build
