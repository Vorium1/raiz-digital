name: Report V4 Preview QA

on:
  push:
    branches:
      - "feature/report-v4-3-page-dashboard"
    paths:
      - ".github/workflows/report-v4-preview-qa.yml"
      - "e2e/report-v4-preview.spec.ts"
      - "src/domain/published-result-dashboard.ts"
      - "src/components/published-recommendation-dashboard.tsx"
      - "src/domain/recommendation-display.ts"
      - "src/domain/published-recommendation-dashboard.ts"
      - "src/components/published-parameter-dashboard.tsx"
      - "src/app/(platform)/resultado/**"
      - "src/app/ux3-result-document.css"
  workflow_dispatch:

concurrency:
  group: report-v4-preview-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  visual:
    name: report-v4-preview
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    env:
      HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_SSL: require

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Obter token OIDC para Deployment Protection
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Descobrir Preview Vercel deste SHA
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 60; attempt++) {
              const deployments = await github.rest.repos.listDeployments({
                owner, repo, sha: context.sha, per_page: 20,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 20,
                });
                const ready = statuses.data.find((status) =>
                  status.state === "success"
                  && typeof status.environment_url === "string"
                  && status.environment_url.startsWith("https://")
                );
                if (ready) {
                  core.setOutput("url", ready.environment_url);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.setFailed("Nenhum environment_url de Preview ficou pronto para o SHA atual.");

      - name: Instalar dependências
        run: npm ci

      - name: Preparar sessão temporária e laudo oficial da homologação
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createHash, randomBytes } from "node:crypto";
          import pg from "pg";

          const databaseUrl = process.env.HOMOLOGATION_DATABASE_URL?.trim();
          if (!databaseUrl) throw new Error("HOMOLOGATION_DATABASE_URL ausente.");

          const pool = new pg.Pool({
            connectionString: databaseUrl,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          const client = await pool.connect();

          try {
            await client.query("BEGIN");
            const account = await client.query(
              `SELECT u.id::text AS user_id, tm.tenant_id::text AS tenant_id
               FROM users u
               JOIN tenant_members tm ON tm.user_id=u.id AND tm.active=true
               JOIN tenants t ON t.id=tm.tenant_id AND t.status='ACTIVE'
               WHERE u.email='admin@raiz.local'::citext
               ORDER BY u.is_platform_curator DESC, tm.tenant_id
               LIMIT 1`,
            );
            const user = account.rows[0];
            if (!user?.user_id || !user?.tenant_id) throw new Error("Conta E2E ativa não encontrada.");

            const target = await client.query(
              `SELECT
                   i.analysis_id::text AS analysis_id,
                   coalesce(
                     jsonb_array_length(
                       CASE
                         WHEN jsonb_typeof(g.response_payload->'prescription'->'recommendations')='array'
                           THEN g.response_payload->'prescription'->'recommendations'
                         ELSE '[]'::jsonb
                       END
                     ),
                     0
                   )::int AS recommendation_count,
                   coalesce(
                     jsonb_array_length(
                       CASE
                         WHEN jsonb_typeof(g.response_payload->'prescription'->'managementPractices')='array'
                           THEN g.response_payload->'prescription'->'managementPractices'
                         ELSE '[]'::jsonb
                       END
                     ),
                     0
                   )::int AS management_count,
                   nullif(published_event.metadata->>'commercialPlanSnapshotId','') IS NOT NULL AS has_commercial_plan,
                   r.published_at
               FROM reports r
               JOIN interpretations i
                 ON i.tenant_id=r.tenant_id
                AND i.id=r.interpretation_id
               JOIN ai_generations g
                 ON g.tenant_id=r.tenant_id
                AND g.id=r.prescription_generation_id
               LEFT JOIN LATERAL (
                 SELECT ae.metadata
                 FROM audit_events ae
                 WHERE ae.tenant_id=r.tenant_id
                   AND ae.entity_type='report'
                   AND ae.entity_id=r.id
                   AND ae.action='REPORT_PUBLISHED'
                 ORDER BY ae.created_at DESC
                 LIMIT 1
               ) published_event ON true
               WHERE r.tenant_id=$1::uuid
                 AND r.prescription_generation_id IS NOT NULL
                 AND r.storage_key LIKE 'inline:v1:%'
               ORDER BY
                 recommendation_count DESC,
                 management_count DESC,
                 has_commercial_plan DESC,
                 r.published_at DESC
               LIMIT 10`,
              [user.tenant_id],
            );
            const candidates = target.rows;
            const selected = candidates.find((candidate) => candidate.analysis_id) ?? null;
            const analysisId = selected?.analysis_id ?? "";
            if (!analysisId) throw new Error("Nenhum laudo oficial V3 inline com prescrição congelada encontrado.");

            const recommendationCount = Number(selected.recommendation_count ?? 0);
            const managementCount = Number(selected.management_count ?? 0);
            const hasCommercialPlan = Boolean(selected.has_commercial_plan);
            console.log(
              `report-v4-richest-candidate: recommendations=${recommendationCount}; management=${managementCount}; commercial=${hasCommercialPlan ? "yes" : "no"}`,
            );

            const token = randomBytes(32).toString("base64url");
            const tokenHash = createHash("sha256").update(token).digest("hex");
            const session = await client.query(
              `INSERT INTO user_sessions (user_id, tenant_id, token_hash, expires_at, user_agent, ip_hash)
               VALUES ($1::uuid,$2::uuid,$3,now()+interval '45 minutes','github-actions-report-v4-qa',NULL)
               RETURNING id::text`,
              [user.user_id, user.tenant_id, tokenHash],
            );
            await client.query("COMMIT");

            console.log(`::add-mask::${token}`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_TOKEN=${token}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_ID=${session.rows[0].id}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_ANALYSIS_ID=${analysisId}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_RECOMMENDATION_COUNT=${recommendationCount}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_MANAGEMENT_COUNT=${managementCount}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_COMMERCIAL=${hasCommercialPlan ? "1" : "0"}\n`);
          } catch (error) {
            await client.query("ROLLBACK").catch(() => {});
            throw error;
          } finally {
            client.release();
            await pool.end();
          }
          NODE

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar gate visual do relatório V4
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npx playwright test e2e/report-v4-preview.spec.ts

      - name: Revogar sessão temporária
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_SESSION_ID:-}" ] || [ -z "${HOMOLOGATION_DATABASE_URL:-}" ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import pg from "pg";
          const pool = new pg.Pool({
            connectionString: process.env.HOMOLOGATION_DATABASE_URL,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          await pool.query(
            "UPDATE user_sessions SET revoked_at=now() WHERE id=$1::uuid AND user_agent='github-actions-report-v4-qa' AND revoked_at IS NULL",
            [process.env.E2E_SESSION_ID],
          );
          await pool.end();
          NODE

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-v4-preview-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
