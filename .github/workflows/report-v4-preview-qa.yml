name: Report V4 Preview QA

on:
  push:
    branches:
      - "feature/report-v4-3-page-dashboard"
    paths:
      - ".github/workflows/report-v4-preview-qa.yml"
      - "e2e/report-v4-preview.spec.ts"
      - "src/domain/published-result-dashboard.ts"
      - "src/components/published-recommendation-dashboard.tsx"
      - "src/domain/recommendation-display.ts"
      - "src/domain/published-recommendation-dashboard.ts"
      - "src/components/published-parameter-dashboard.tsx"
      - "src/app/(platform)/resultado/**"
      - "src/app/ux3-result-document.css"
  workflow_dispatch:

concurrency:
  group: report-v4-preview-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  visual:
    name: report-v4-preview
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    env:
      HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
      DATABASE_SSL: require

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Obter token OIDC para Deployment Protection
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Descobrir Preview Vercel deste SHA
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 24; attempt++) {
              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: context.sha,
              });
              const vercel = combined.data.statuses.find((status) => status.context === "Vercel");
              if (
                vercel?.state === "failure"
                && typeof vercel.target_url === "string"
                && vercel.target_url.includes("build-rate-limit")
              ) {
                core.notice("Vercel está rate-limited neste SHA; QA seguirá com build local.");
                core.setOutput("available", "false");
                core.setOutput("reason", "vercel-build-rate-limit");
                return;
              }

              const deployments = await github.rest.repos.listDeployments({
                owner, repo, sha: context.sha, per_page: 20,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 20,
                });
                const ready = statuses.data.find((status) =>
                  status.state === "success"
                  && typeof status.environment_url === "string"
                  && status.environment_url.startsWith("https://")
                );
                if (ready) {
                  core.setOutput("url", ready.environment_url);
                  core.setOutput("available", "true");
                  core.setOutput("reason", "vercel-preview");
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            core.notice("Preview Vercel não ficou disponível a tempo; QA seguirá com build local.");
            core.setOutput("available", "false");
            core.setOutput("reason", "preview-unavailable");

      - name: Instalar dependências
        run: npm ci

      - name: Build local de fallback quando não houver Preview
        if: steps.preview.outputs.available != 'true'
        env:
          APP_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          DATABASE_SSL: require
          DATA_MODE: database
          APP_URL: http://127.0.0.1:3000
          REPORT_STORAGE_PROVIDER: inline
          RAIZ_ASSISTANT_MODE: local
        run: npm run build

      - name: Preparar sessão temporária e laudo oficial da homologação
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createHash, randomBytes } from "node:crypto";
          import pg from "pg";

          const databaseUrl = process.env.HOMOLOGATION_DATABASE_URL?.trim();
          if (!databaseUrl) throw new Error("HOMOLOGATION_DATABASE_URL ausente.");

          const pool = new pg.Pool({
            connectionString: databaseUrl,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          const client = await pool.connect();

          try {
            await client.query("BEGIN");
            const account = await client.query(
              `SELECT u.id::text AS user_id, tm.tenant_id::text AS tenant_id
               FROM users u
               JOIN tenant_members tm ON tm.user_id=u.id AND tm.active=true
               JOIN tenants t ON t.id=tm.tenant_id AND t.status='ACTIVE'
               WHERE u.email='admin@raiz.local'::citext
               ORDER BY u.is_platform_curator DESC, tm.tenant_id
               LIMIT 1`,
            );
            const user = account.rows[0];
            if (!user?.user_id || !user?.tenant_id) throw new Error("Conta E2E ativa não encontrada.");

            const target = await client.query(
              `SELECT
                   i.analysis_id::text AS analysis_id,
                   coalesce(
                     jsonb_array_length(
                       CASE
                         WHEN jsonb_typeof(g.response_payload->'prescription'->'recommendations')='array'
                           THEN g.response_payload->'prescription'->'recommendations'
                         ELSE '[]'::jsonb
                       END
                     ),
                     0
                   )::int AS recommendation_count,
                   coalesce(
                     jsonb_array_length(
                       CASE
                         WHEN jsonb_typeof(g.response_payload->'prescription'->'managementPractices')='array'
                           THEN g.response_payload->'prescription'->'managementPractices'
                         ELSE '[]'::jsonb
                       END
                     ),
                     0
                   )::int AS management_count,
                   nullif(published_event.metadata->>'commercialPlanSnapshotId','') IS NOT NULL AS has_commercial_plan,
                   r.id::text AS report_id,
                   r.interpretation_id::text AS interpretation_id,
                   r.prescription_generation_id::text AS prescription_generation_id,
                   r.revision::int AS report_revision,
                   r.storage_key,
                   r.published_at
               FROM reports r
               JOIN interpretations i
                 ON i.tenant_id=r.tenant_id
                AND i.id=r.interpretation_id
               JOIN ai_generations g
                 ON g.tenant_id=r.tenant_id
                AND g.id=r.prescription_generation_id
               LEFT JOIN LATERAL (
                 SELECT ae.metadata
                 FROM audit_events ae
                 WHERE ae.tenant_id=r.tenant_id
                   AND ae.entity_type='report'
                   AND ae.entity_id=r.id
                   AND ae.action='REPORT_PUBLISHED'
                 ORDER BY ae.created_at DESC
                 LIMIT 1
               ) published_event ON true
               WHERE r.tenant_id=$1::uuid
                 AND r.prescription_generation_id IS NOT NULL
                 AND r.storage_key LIKE 'inline:v1:%'
               ORDER BY
                 recommendation_count DESC,
                 management_count DESC,
                 has_commercial_plan DESC,
                 r.published_at DESC
               LIMIT 10`,
              [user.tenant_id],
            );
            const candidates = target.rows;
            const selected = candidates.find((candidate) => candidate.analysis_id) ?? null;
            const analysisId = selected?.analysis_id ?? "";
            if (!analysisId) throw new Error("Nenhum laudo oficial V3 inline com prescrição congelada encontrado.");

            const recommendationCount = Number(selected.recommendation_count ?? 0);
            const managementCount = Number(selected.management_count ?? 0);
            const hasCommercialPlan = Boolean(selected.has_commercial_plan);
            console.log(
              `report-v4-richest-candidate: recommendations=${recommendationCount}; management=${managementCount}; commercial=${hasCommercialPlan ? "yes" : "no"}`,
            );

            // Fixture visual temporário: clona um snapshot oficial real para provar que a Página 2
            // suporta um caso pesado (3 blocos, 8 recomendações, manejo e plano comercial) sem
            // alterar o laudo original. O registro é apagado no cleanup do workflow.
            const inlinePrefix = "inline:v1:";
            if (!String(selected.storage_key ?? "").startsWith(inlinePrefix)) {
              throw new Error("O laudo-base do fixture visual precisa usar storage inline.");
            }
            const originalSnapshot = JSON.parse(
              Buffer.from(String(selected.storage_key).slice(inlinePrefix.length), "base64").toString("utf8"),
            );
            if (Number(originalSnapshot?.reportSnapshotVersion) !== 3) {
              throw new Error("O laudo-base do fixture visual precisa ser snapshot V3.");
            }

            const fixtureRecommendations = [
              { inputType: "CALCARIO_PRNT100", quantity: 2.2, unit: "t/ha", rationale: "Correção de acidez conforme a necessidade aprovada para o solo." },
              { inputType: "GESSO", quantity: 0.7, unit: "t/ha", rationale: "Condicionamento subsuperficial aprovado para esta decisão." },
              { inputType: "N", quantity: 40, unit: "kg/ha", rationale: "Dose de nitrogênio aprovada para o manejo informado." },
              { inputType: "P2O5", quantity: 80, unit: "kg/ha", rationale: "Reposição fosfatada conforme meta e interpretação aprovadas." },
              { inputType: "K2O", quantity: 75, unit: "kg/ha", rationale: "Reposição potássica definida pela regra agronômica aprovada." },
              { inputType: "S", quantity: 15, unit: "kg/ha", rationale: "Enxofre liberado conforme a evidência técnica congelada." },
              { inputType: "B", quantity: 1.0, unit: "kg/ha", rationale: "Boro aprovado com dose explícita e rastreável." },
              { inputType: "ZN", quantity: 2.5, unit: "kg/ha", rationale: "Zinco aprovado com base no diagnóstico congelado." },
            ];
            const fixtureManagement = [
              "Distribuir o corretivo de forma uniforme na área produtiva.",
              "Aplicar os fertilizantes conforme a janela de manejo definida para a cultura.",
              "Registrar a aplicação realizada para comparação com a recomendação oficial.",
            ];
            const fixtureMissing = [
              "A escolha do produto comercial não altera a necessidade agronômica congelada.",
              "As doses exibidas pertencem a este cenário oficial e não devem ser extrapoladas para outro talhão.",
            ];

            const fixtureAreaHa = Number(originalSnapshot?.publishedContext?.areaHa ?? 2);
            const productARate = 154;
            const productBRate = 125;
            const productATotalTon = productARate * fixtureAreaHa / 1000;
            const productBTotalTon = productBRate * fixtureAreaHa / 1000;
            const productAPrice = 4200;
            const productBPrice = 2600;
            const costPerHa = productARate / 1000 * productAPrice + productBRate / 1000 * productBPrice;
            const totalCost = costPerHa * fixtureAreaHa;

            originalSnapshot.approvedPrescription.responsePayload = {
              ...(originalSnapshot.approvedPrescription.responsePayload ?? {}),
              prescription: {
                ...(originalSnapshot.approvedPrescription.responsePayload?.prescription ?? {}),
                summary: "O diagnóstico sustenta correção do solo, adubação principal e micronutrientes nas doses aprovadas. O manejo deve seguir as condições registradas neste laudo.",
                recommendations: fixtureRecommendations,
                managementPractices: fixtureManagement,
                missingInformation: fixtureMissing,
              },
            };
            originalSnapshot.commercialPlanSnapshot = {
              id: "00000000-0000-4000-8000-0000000000aa",
              label: "Cenário visual completo de homologação",
              simulationMode: "PK_PAIR",
              schemaVersion: 1,
              areaHa: fixtureAreaHa,
              sourceTargets: [
                { recommendationId: "00000000-0000-4000-8000-0000000000a1" },
                { recommendationId: "00000000-0000-4000-8000-0000000000a2" },
              ],
              productSnapshots: [
                { code: "QA-P", name: "Fertilizante fosfatado · QA visual", pricePerTon: productAPrice },
                { code: "QA-K", name: "Fertilizante potássico · QA visual", pricePerTon: productBPrice },
              ],
              engineInput: { fixture: true },
              engineOutput: {
                productA: { rateKgPerHa: productARate, totalProductTon: productATotalTon, constraintsSatisfied: true, constraintViolations: [] },
                productB: { rateKgPerHa: productBRate, totalProductTon: productBTotalTon, constraintsSatisfied: true, constraintViolations: [] },
                costPerHa,
                totalCost,
              },
              createdAt: new Date().toISOString(),
            };
            originalSnapshot.revision = Number(selected.report_revision) + 1000;
            originalSnapshot.publishedAt = new Date().toISOString();

            const fixtureContent = JSON.stringify(originalSnapshot);
            const fixtureSha = createHash("sha256").update(fixtureContent).digest("hex");
            const fixtureStorageKey = inlinePrefix + Buffer.from(fixtureContent, "utf8").toString("base64");
            const tempReport = await client.query(
              `INSERT INTO reports (
                   tenant_id, interpretation_id, prescription_generation_id, revision,
                   storage_key, sha256, published_at, published_by
                 )
                 VALUES ($1::uuid,$2::uuid,$3::uuid,$4,$5,$6,now()+interval '1 second',$7::uuid)
                 RETURNING id::text`,
              [
                user.tenant_id,
                selected.interpretation_id,
                selected.prescription_generation_id,
                Number(selected.report_revision) + 1000,
                fixtureStorageKey,
                fixtureSha,
                user.user_id,
              ],
            );
            const tempReportId = tempReport.rows[0]?.id;
            if (!tempReportId) throw new Error("Não foi possível criar o report temporário do QA rico.");
            console.log("report-v4-rich-fixture: recommendations=8; groups=3; management=3; commercial=yes; products=2");

            const token = randomBytes(32).toString("base64url");
            const tokenHash = createHash("sha256").update(token).digest("hex");
            const session = await client.query(
              `INSERT INTO user_sessions (user_id, tenant_id, token_hash, expires_at, user_agent, ip_hash)
               VALUES ($1::uuid,$2::uuid,$3,now()+interval '45 minutes','github-actions-report-v4-qa',NULL)
               RETURNING id::text`,
              [user.user_id, user.tenant_id, tokenHash],
            );
            await client.query("COMMIT");

            console.log(`::add-mask::${token}`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_TOKEN=${token}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_ID=${session.rows[0].id}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_ANALYSIS_ID=${analysisId}\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_RECOMMENDATION_COUNT=8\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_RECOMMENDATION_GROUPS=3\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_MANAGEMENT_COUNT=3\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_COMMERCIAL=1\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_EXPECTED_COMMERCIAL_PRODUCTS=2\n`);
            appendFileSync(process.env.GITHUB_ENV, `E2E_TEMP_REPORT_ID=${tempReportId}\n`);
          } catch (error) {
            await client.query("ROLLBACK").catch(() => {});
            throw error;
          } finally {
            client.release();
            await pool.end();
          }
          NODE

      - name: Iniciar app local de fallback
        if: steps.preview.outputs.available != 'true'
        env:
          APP_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          DATABASE_SSL: require
          DATA_MODE: database
          APP_URL: http://127.0.0.1:3000
          REPORT_STORAGE_PROVIDER: inline
          RAIZ_ASSISTANT_MODE: local
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- -H 127.0.0.1 -p 3000 > /tmp/report-v4-local.log 2>&1 &
          echo $! > /tmp/report-v4-local.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              echo "report-v4-local: ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/report-v4-local.log || true
          echo "::error::Build local não ficou pronto para o QA."
          exit 1

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar gate visual do relatório V4
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.available == 'true' && steps.preview.outputs.url || 'http://127.0.0.1:3000' }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.preview.outputs.available == 'true' && steps.oidc.outputs.token || '' }}
        run: |
          echo "report-v4-qa-target: ${{ steps.preview.outputs.reason }}"
          npx playwright test e2e/report-v4-preview.spec.ts

      - name: Parar app local de fallback
        if: always() && steps.preview.outputs.available != 'true'
        shell: bash
        run: |
          if [ -f /tmp/report-v4-local.pid ]; then
            kill "$(cat /tmp/report-v4-local.pid)" 2>/dev/null || true
          fi

      - name: Revogar sessão temporária
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_SESSION_ID:-}" ] || [ -z "${HOMOLOGATION_DATABASE_URL:-}" ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import pg from "pg";
          const pool = new pg.Pool({
            connectionString: process.env.HOMOLOGATION_DATABASE_URL,
            ssl: process.env.DATABASE_SSL === "require" ? { rejectUnauthorized: false } : undefined,
          });
          await pool.query(
            "UPDATE user_sessions SET revoked_at=now() WHERE id=$1::uuid AND user_agent='github-actions-report-v4-qa' AND revoked_at IS NULL",
            [process.env.E2E_SESSION_ID],
          );
          if (process.env.E2E_TEMP_REPORT_ID) {
            await pool.query(
              "DELETE FROM reports WHERE id=$1::uuid AND revision >= 1000",
              [process.env.E2E_TEMP_REPORT_ID],
            );
          }
          await pool.end();
          NODE

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-v4-preview-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
