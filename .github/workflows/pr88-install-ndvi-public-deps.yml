name: PR88 Install NDVI Public Dependencies

on:
  push:
    branches:
      - "feature/ux-2.0-intelligent-flow"
    paths:
      - ".github/workflows/pr88-install-ndvi-public-deps.yml"

permissions:
  contents: write

jobs:
  install:
    if: contains(github.event.head_commit.message, 'bootstrap public Sentinel dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ux-2.0-intelligent-flow
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add exact runtime dependencies
        run: npm install --save-exact geotiff proj4 sharp
      - name: Commit lockfile generated by npm
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already present."
            exit 0
          fi
          git commit -m "chore(ndvi): add public Sentinel dependencies"
          git push origin HEAD:feature/ux-2.0-intelligent-flow
