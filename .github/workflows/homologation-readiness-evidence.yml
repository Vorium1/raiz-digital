name: Homologation Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "SHA completo (40 hex) do candidato a homologar"
        required: true
        type: string
  push:
    branches:
      - "audit/homologation-readiness"
    paths:
      - ".homologation-trigger/**"

permissions:
  contents: read

concurrency:
  group: homologation-readiness-evidence
  cancel-in-progress: false

jobs:
  readiness:
    name: readiness-candidate-sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologation
    env:
      DATA_MODE: ${{ vars.DATA_MODE }}
      DATABASE_SSL: ${{ vars.DATABASE_SSL }}
      APP_URL: ${{ vars.APP_URL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      REPORT_STORAGE_PROVIDER: ${{ vars.REPORT_STORAGE_PROVIDER }}
      RAIZ_ASSISTANT_MODE: ${{ vars.RAIZ_ASSISTANT_MODE }}
      MERCADO_PAGO_CHECKOUT_ENABLED: ${{ vars.MERCADO_PAGO_CHECKOUT_ENABLED }}

    steps:
      - name: Ler disparo controlado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolver SHA candidato
        id: candidate
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "audit/homologation-readiness" ]; then
              echo "::error::Branch não autorizada para readiness de homologação."
              exit 1
            fi
            TRIGGER_FILE=".homologation-trigger/candidate-sha.txt"
            if [ ! -f "${TRIGGER_FILE}" ]; then
              echo "::error::Trigger controlado sem candidate-sha.txt."
              exit 1
            fi
            CANDIDATE_SHA="$(tr -d '[:space:]' < "${TRIGGER_FILE}")"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CANDIDATE_SHA="$(printf '%s' "${DISPATCH_SHA:-}" | tr -d '[:space:]')"
          else
            echo "::error::Evento não autorizado para readiness de homologação."
            exit 1
          fi

          if ! [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha deve ser um SHA Git completo de 40 caracteres hexadecimais."
            exit 1
          fi

          CANDIDATE_SHA="${CANDIDATE_SHA,,}"
          echo "sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "SHA candidato declarado: ${CANDIDATE_SHA}"

      - name: Checkout exato do candidato
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirmar identidade do código auditado
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          RESOLVED_SHA="$(git rev-parse HEAD)"
          if [ "${RESOLVED_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checkout não corresponde ao SHA candidato declarado."
            exit 1
          fi
          echo "resolved_sha=${RESOLVED_SHA}" >> "${GITHUB_OUTPUT}"
          {
            echo "## RAIZ Digital · candidato de homologação"
            echo
            echo "SHA auditado: \`${RESOLVED_SHA}\`"
            echo
            echo "O workflow não executa merge, deploy ou promoção de ambiente."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências do SHA candidato
        run: npm ci

      - name: Gerar readiness sanitizada
        id: readiness
        shell: bash
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          CABEDA_TENANT_ID: ${{ secrets.CABEDA_TENANT_ID }}
        run: |
          set -u
          RESULT_FILE="homologation-readiness.json"
          echo "result_file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"

          set +e
          node --experimental-strip-types scripts/export-homologation-readiness.mjs > "${RESULT_FILE}"
          STATUS=$?
          set -e

          echo "exit_code=${STATUS}" >> "${GITHUB_OUTPUT}"
          test -s "${RESULT_FILE}"
          echo "Evidência de readiness gerada sem serializar valores brutos de secrets/configuração."

      - name: Validar contexto mínimo NDVI sem expor valores
        id: ndvi_context
        shell: bash
        env:
          HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          NDVI_AUDIT_TENANT_ID: ${{ secrets.NDVI_AUDIT_TENANT_ID }}
          NDVI_AUDIT_FIELD_ID: ${{ secrets.NDVI_AUDIT_FIELD_ID }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          READY=true
          MISSING=0
          for name in HOMOLOGATION_DATABASE_URL NDVI_AUDIT_TENANT_ID NDVI_AUDIT_FIELD_ID S3_ACCESS_KEY S3_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              READY=false
              MISSING=$((MISSING + 1))
            fi
          done
          for name in STORAGE_PROVIDER S3_ENDPOINT S3_BUCKET; do
            if [ -z "${!name:-}" ]; then
              READY=false
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "${STORAGE_PROVIDER:-}" != "s3" ]; then
            READY=false
          fi
          echo "ready=${READY}" >> "${GITHUB_OUTPUT}"
          echo "missing_count=${MISSING}" >> "${GITHUB_OUTPUT}"
          echo "Contexto NDVI avaliado de forma privacy-safe; campos obrigatórios ausentes: ${MISSING}."

      - name: Auditar cadeia de custódia NDVI read-only
        id: ndvi
        if: ${{ steps.ndvi_context.outputs.ready == 'true' }}
        shell: bash
        env:
          HOMOLOGATION_DATABASE_URL: ${{ secrets.HOMOLOGATION_DATABASE_URL }}
          NDVI_AUDIT_TENANT_ID: ${{ secrets.NDVI_AUDIT_TENANT_ID }}
          NDVI_AUDIT_FIELD_ID: ${{ secrets.NDVI_AUDIT_FIELD_ID }}
          NDVI_AUDIT_ACTOR_USER_ID: ${{ secrets.NDVI_AUDIT_ACTOR_USER_ID }}
          NDVI_AUDIT_DATE: ${{ vars.NDVI_AUDIT_DATE }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
        run: |
          set -u
          RAW_FILE="ndvi-raster-audit-raw.json"
          ERROR_FILE="ndvi-raster-audit-error.txt"
          echo "raw_file=${RAW_FILE}" >> "${GITHUB_OUTPUT}"

          set +e
          npm run --silent ndvi:audit-raster > "${RAW_FILE}" 2> "${ERROR_FILE}"
          STATUS=$?
          set -e

          echo "exit_code=${STATUS}" >> "${GITHUB_OUTPUT}"
          if [ "${STATUS}" -eq 0 ]; then
            echo "Auditoria NDVI concluiu com evidência imutável positiva."
          elif [ "${STATUS}" -eq 2 ]; then
            echo "Auditoria NDVI concluiu com blocker de custódia."
          else
            echo "Auditoria NDVI ficou indisponível operacionalmente; detalhes de infraestrutura não serão impressos."
          fi

      - name: Gerar evidência NDVI sanitizada
        id: ndvi_evidence
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.resolved_sha }}
          CONTEXT_READY: ${{ steps.ndvi_context.outputs.ready }}
          MISSING_COUNT: ${{ steps.ndvi_context.outputs.missing_count }}
          AUDIT_STATUS: ${{ steps.ndvi.outputs.exit_code }}
          RAW_FILE: ${{ steps.ndvi.outputs.raw_file }}
        run: |
          set -euo pipefail
          OUTPUT="ndvi-raster-audit-evidence.json"
          echo "result_file=${OUTPUT}" >> "${GITHUB_OUTPUT}"
          node <<'NODE'
          const fs = require("node:fs");
          const candidateSha = process.env.CANDIDATE_SHA || null;
          const contextReady = process.env.CONTEXT_READY === "true";
          const missingCount = Number(process.env.MISSING_COUNT || 0);
          const auditStatus = process.env.AUDIT_STATUS || "";
          let raw = null;
          const rawFile = process.env.RAW_FILE;
          if (contextReady && rawFile && fs.existsSync(rawFile) && fs.statSync(rawFile).size > 0) {
            try { raw = JSON.parse(fs.readFileSync(rawFile, "utf8")); } catch {}
          }
          const evidence = {
            schemaVersion: 1,
            evidenceType: "RAIZ_NDVI_IMMUTABLE_RASTER_AUDIT",
            candidateSha,
            status: !contextReady ? "BLOCKED_CONTEXT" : auditStatus === "0" ? "PASS" : auditStatus === "2" ? "BLOCKED" : "UNAVAILABLE",
            readyForImmutableRasterEvidence: raw?.readyForImmutableRasterEvidence === true,
            missingContextCount: contextReady ? 0 : missingCount,
            capturedAt: raw?.capturedAt || null,
            storage: raw?.storage || null,
            algorithm: raw?.algorithm || null,
            mosaickingOrder: raw?.mosaickingOrder || null,
            objectIntegrityVerified: raw?.objectIntegrityVerified === true,
            databaseImmutabilityVerified: raw?.databaseImmutabilityVerified === true,
            runtimeDeletePrivilegeRevoked: raw?.runtimeDeletePrivilegeRevoked === true,
            blockers: Array.isArray(raw?.blockers) ? raw.blockers : [],
            note: "Evidência sanitizada: nenhum secret, bbox, coordenada, chave de objeto ou hash do raster é serializado."
          };
          fs.writeFileSync("ndvi-raster-audit-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Registrar resumos privacy-safe
        if: always()
        shell: bash
        env:
          READINESS_FILE: ${{ steps.readiness.outputs.result_file }}
          NDVI_FILE: ${{ steps.ndvi_evidence.outputs.result_file }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require("node:fs");
          console.log("## Readiness automatizada");
          const readinessFile = process.env.READINESS_FILE;
          if (readinessFile && fs.existsSync(readinessFile)) {
            const evidence = JSON.parse(fs.readFileSync(readinessFile, "utf8"));
            const summary = evidence.summary || {};
            console.log(`- Status: **${evidence.status || "unavailable"}**`);
            console.log(`- Blockers automatizados: **${summary.blockedCount ?? "n/a"}**`);
            console.log(`- Gates manuais/externos: **${summary.manualGateCount ?? "n/a"}**`);
          } else {
            console.log("- Status: **unavailable**");
          }
          console.log("");
          console.log("## Custódia NDVI");
          const ndviFile = process.env.NDVI_FILE;
          if (ndviFile && fs.existsSync(ndviFile)) {
            const evidence = JSON.parse(fs.readFileSync(ndviFile, "utf8"));
            console.log(`- Status: **${evidence.status}**`);
            console.log(`- readyForImmutableRasterEvidence: **${evidence.readyForImmutableRasterEvidence}**`);
            console.log(`- Imutabilidade PostgreSQL: **${evidence.databaseImmutabilityVerified}**`);
            console.log(`- Integridade do objeto: **${evidence.objectIntegrityVerified}**`);
            if (evidence.missingContextCount) console.log(`- Campos obrigatórios ausentes: **${evidence.missingContextCount}**`);
          }
          console.log("");
          console.log("Esta execução não autoriza produção e não substitui #24, #25, #27, aceitação agronômica nem GO humano.");
          NODE

      - name: Salvar evidências sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologation-candidate-evidence-${{ steps.identity.outputs.resolved_sha }}
          path: |
            homologation-readiness.json
            ndvi-raster-audit-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Aplicar resultado fail-closed
        if: always()
        shell: bash
        env:
          READINESS_STATUS: ${{ steps.readiness.outputs.exit_code }}
          NDVI_CONTEXT_READY: ${{ steps.ndvi_context.outputs.ready }}
          NDVI_STATUS: ${{ steps.ndvi.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${READINESS_STATUS:-}" != "0" ]; then
            echo "::error::Readiness automatizada não passou para o SHA candidato."
            exit 1
          fi
          if [ "${NDVI_CONTEXT_READY:-}" != "true" ]; then
            echo "::error::Contexto obrigatório da auditoria NDVI está incompleto no Environment homologation."
            exit 1
          fi
          if [ "${NDVI_STATUS:-}" != "0" ]; then
            echo "::error::A auditoria NDVI não comprovou readyForImmutableRasterEvidence=true."
            exit 1
          fi
          echo "SHA candidato passou nos gates automatizados executáveis. Gates externos/manuais continuam independentes."
