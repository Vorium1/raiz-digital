name: NDVI Public Sentinel Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/ux-2.0-intelligent-flow"
    paths:
      - ".github/workflows/ndvi-public-smoke.yml"
      - "scripts/smoke-earth-search-ndvi.mjs"
      - "src/lib/satellite/earth-search-ndvi-provider.ts"
      - "src/lib/satellite/copernicus-ndvi-provider.ts"

permissions:
  contents: read

jobs:
  smoke:
    name: earth-search-cog-ndvi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar Earth Search + COG + raster NDVI
        run: node --experimental-strip-types scripts/smoke-earth-search-ndvi.mjs
